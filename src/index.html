<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantry Inventory</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #b45309);
      --accent-hover: var(--hub-primary-hover, #92400e);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 8px);
      --green: #047857; --green-soft: #d1fae5;
      --amber: #b45309; --amber-soft: #fef3c7;
      --red: #b91c1c; --red-soft: #fee2e2;
      --blue-soft: #dbeafe;
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 820px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    h2 { font-size: 1rem; margin-bottom: 10px; }
    .muted { color: var(--muted); } .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
    .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .item.low { border-left: 4px solid var(--amber); }
    .item.out { border-left: 4px solid var(--red); }
    .item-name { font-weight: 750; }
    .item-meta { margin-top: 2px; color: var(--muted); font-size: .8rem; }
    .qty { display: flex; align-items: center; gap: 8px; }
    .qty-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-mid); background: var(--surface); font-size: 1.1rem; font-weight: 800; cursor: pointer; color: var(--text); }
    .qty-btn:hover { background: #f8fafc; }
    .qty-val { min-width: 42px; text-align: center; font-weight: 800; }
    .pill { display: inline-flex; align-items: center; min-height: 20px; padding: 1px 8px; border-radius: 999px; background: #f1f5f9; color: var(--muted); font-size: .7rem; font-weight: 800; }
    .pill.good { background: var(--green-soft); color: var(--green); }
    .pill.warn { background: var(--amber-soft); color: var(--amber); }
    .pill.bad { background: var(--red-soft); color: var(--red); }
    .pill.info { background: var(--blue-soft); color: #1d4ed8; }
    .tabs { display: flex; gap: 4px; background: var(--border); padding: 3px; border-radius: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab { flex: 1; border: 0; border-radius: 8px; background: transparent; color: var(--muted); padding: 7px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer; min-height: 38px; background: var(--accent); color: var(--accent-fg); }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: #f8fafc; }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: transparent; }
    .btn-sm { min-height: 30px; padding: 4px 9px; font-size: .77rem; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .form { display: grid; gap: 10px; }
    .field { display: grid; gap: 4px; }
    label { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
    input, textarea, select { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px; padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text); }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .empty, .loading { color: var(--muted); text-align: center; padding: 32px 16px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .notice { background: var(--green-soft); color: var(--green); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal { background: var(--surface); border-radius: 12px; padding: 18px; width: 100%; max-width: 460px; box-shadow: 0 12px 40px rgba(0,0,0,.25); max-height: 90vh; overflow-y: auto; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
    .grid.two { display: grid; gap: 10px; }
    @media (min-width: 560px) { .grid.two { grid-template-columns: 1fr 1fr; } }
  </style>
  <base href="/run/pantry/">
</head>
<body>
<div class="app">
  <div id="root" class="loading">Loading…</div>
</div>

<script type="module">
import { esc, hubConfirm, hubAlert, crossWrite } from "/hub-sdk.js";
import { CATEGORIES, CAT_LABEL, statusFor, daysUntil as daysUntilOf, visibleItems as visibleItemsOf } from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;

let members = [];
let currentMember = null;
let items = [];
let view = "all";     // 'all' | 'fridge' | 'freezer' | 'pantry' | 'other' | 'low'
let error = "";
let notice = "";
let modalEl = null;

function nowIso() { return new Date().toISOString(); }
function today() { return new Date().toISOString().slice(0, 10); }
function uid() { return crypto.randomUUID(); }

async function dbq(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-2", name: "Jordan", role: "adult" },
    ];
  } else {
    try {
      const res = await fetch(`${CONTEXT}?keys=family.members`);
      members = ((await res.json())["family.members"]) ?? [];
    } catch { members = []; }
  }
  currentMember = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

function seedDemo() {
  items = [
    { id: "d1", name: "Milk", category: "fridge", quantity: 1, unit: "gal", low_threshold: 1, status: "low", expiry_date: today(), owner_name: "", note: "", created_by_id: "demo-1", created_by_name: "Alex", created_at: nowIso(), updated_at: nowIso() },
    { id: "d2", name: "Pasta", category: "pantry", quantity: 4, unit: "boxes", low_threshold: 2, status: "ok", expiry_date: "", owner_name: "", note: "", created_by_id: "demo-2", created_by_name: "Jordan", created_at: nowIso(), updated_at: nowIso() },
    { id: "d3", name: "Frozen peas", category: "freezer", quantity: 0, unit: "bags", low_threshold: 1, status: "out", expiry_date: "", owner_name: "Jordan", note: "", created_by_id: "demo-2", created_by_name: "Jordan", created_at: nowIso(), updated_at: nowIso() },
  ];
}

async function loadData() {
  if (!DB) { seedDemo(); return; }
  const itemRows = await dbq("SELECT * FROM app_pantry__items ORDER BY name ASC");
  items = itemRows.rows;
}

async function refresh() {
  clearMessages();
  try { await Promise.all([loadMembers(), loadData()]); render(); }
  catch (e) { error = e.message; render(); }
}

function clearMessages() { error = ""; notice = ""; }
function showError(m) { error = m; notice = ""; render(); }
function showNotice(m) { notice = m; error = ""; render(); }


// ── mutations ────────────────────────────────────────────────────────────────
async function saveItem(fields, existingId) {
  const name = fields.name.trim();
  if (!name) return showError("Item needs a name.");
  const quantity = Math.max(0, Number(fields.quantity) || 0);
  const low = Math.max(0, Number(fields.low_threshold) || 0);
  const status = statusFor(quantity, low);
  const now = nowIso();

  if (existingId) {
    const idx = items.findIndex(i => i.id === existingId);
    if (idx === -1) return;
    try {
      if (DB) {
        await dbq(
          `UPDATE app_pantry__items SET name=?, category=?, quantity=?, unit=?, low_threshold=?, status=?, expiry_date=?, owner_name=?, note=?, updated_at=? WHERE id=?`,
          [name, fields.category, quantity, fields.unit.trim(), low, status, fields.expiry_date || "", fields.owner_name.trim(), fields.note.trim(), now, existingId]
        );
      }
      items[idx] = { ...items[idx], name, category: fields.category, quantity, unit: fields.unit.trim(), low_threshold: low, status, expiry_date: fields.expiry_date || "", owner_name: fields.owner_name.trim(), note: fields.note.trim(), updated_at: now };
      closeModal();
      showNotice("Item updated.");
    } catch (e) { showError(e.message); }
    return;
  }

  const row = {
    id: uid(), name, category: fields.category, quantity, unit: fields.unit.trim(),
    low_threshold: low, status, expiry_date: fields.expiry_date || "", owner_name: fields.owner_name.trim(),
    note: fields.note.trim(), created_by_id: currentMember.id, created_by_name: currentMember.name,
    created_at: now, updated_at: now,
  };
  try {
    if (DB) {
      await dbq(
        `INSERT INTO app_pantry__items (id, name, category, quantity, unit, low_threshold, status, expiry_date, owner_name, note, created_by_id, created_by_name, created_at, updated_at)
         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
        [row.id, row.name, row.category, row.quantity, row.unit, row.low_threshold, row.status, row.expiry_date, row.owner_name, row.note, row.created_by_id, row.created_by_name, row.created_at, row.updated_at]
      );
    }
    items = [...items, row].sort((a, b) => a.name.localeCompare(b.name));
    closeModal();
    showNotice(`Added ${row.name}.`);
  } catch (e) { showError(e.message); }
}

async function adjustQty(id, delta) {
  const idx = items.findIndex(i => i.id === id);
  if (idx === -1) return;
  const it = items[idx];
  const quantity = Math.max(0, (Number(it.quantity) || 0) + delta);
  const status = statusFor(quantity, it.low_threshold);
  const now = nowIso();
  // optimistic
  items[idx] = { ...it, quantity, status, updated_at: now };
  render();
  try {
    if (DB) await dbq(`UPDATE app_pantry__items SET quantity=?, status=?, updated_at=? WHERE id=?`, [quantity, status, now, id]);
  } catch (e) { showError(e.message); await loadData().catch(() => {}); render(); }
}

async function removeItem(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  const ok = await hubConfirm({ message: `Remove ${it.name} from the pantry?`, confirmLabel: "Remove", destructive: true });
  if (!ok) return;
  try {
    if (DB) await dbq(`DELETE FROM app_pantry__items WHERE id=?`, [id]);
    items = items.filter(i => i.id !== id);
    showNotice("Removed.");
  } catch (e) { showError(e.message); }
}

async function pushToGrocery(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  try {
    await crossWrite("grocery", "pending_items", [
      { op: "array_append", path: "items", value: { name: it.name, addedBy: "Pantry" } },
    ]);
    showNotice(`Sent “${it.name}” to the Grocery List.`);
  } catch (e) {
    showError("Couldn't reach the Grocery List. Is it installed?");
  }
}

// ── modal ────────────────────────────────────────────────────────────────────
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  const f = modalEl.querySelector("[data-autofocus]");
  if (f) f.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

function openItemModal(existingId) {
  const it = existingId ? items.find(i => i.id === existingId) : null;
  openModal(`
    <h2>${it ? "Edit item" : "Add item"}</h2>
    <form class="form" id="item-form" data-id="${it ? esc(it.id) : ""}">
      <div class="field">
        <label for="f-name">Name</label>
        <input id="f-name" name="name" data-autofocus value="${it ? esc(it.name) : ""}" placeholder="Milk, flour, paper towels…" required />
      </div>
      <div class="grid two">
        <div class="field">
          <label for="f-category">Location</label>
          <select id="f-category" name="category">
            ${CATEGORIES.map(c => `<option value="${c}" ${it && it.category === c ? "selected" : ""}>${CAT_LABEL[c]}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label for="f-owner">Owner (optional)</label>
          <input id="f-owner" name="owner_name" value="${it ? esc(it.owner_name || "") : ""}" placeholder="Shared / name" />
        </div>
      </div>
      <div class="grid two">
        <div class="field">
          <label for="f-qty">Quantity</label>
          <input id="f-qty" name="quantity" type="number" min="0" value="${it ? esc(String(it.quantity)) : "1"}" />
        </div>
        <div class="field">
          <label for="f-unit">Unit</label>
          <input id="f-unit" name="unit" value="${it ? esc(it.unit || "") : ""}" placeholder="boxes, gal, cans…" />
        </div>
      </div>
      <div class="grid two">
        <div class="field">
          <label for="f-low">Low when ≤</label>
          <input id="f-low" name="low_threshold" type="number" min="0" value="${it ? esc(String(it.low_threshold)) : "1"}" />
        </div>
        <div class="field">
          <label for="f-expiry">Expires</label>
          <input id="f-expiry" name="expiry_date" type="date" value="${it ? esc(it.expiry_date || "") : ""}" />
        </div>
      </div>
      <div class="field">
        <label for="f-note">Note</label>
        <input id="f-note" name="note" value="${it ? esc(it.note || "") : ""}" placeholder="Optional" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close>Cancel</button>
        <button class="btn" type="submit">${it ? "Save" : "Add item"}</button>
      </div>
    </form>
  `);
}

// ── render ───────────────────────────────────────────────────────────────────
function daysUntil(dateStr) { return daysUntilOf(dateStr, today()); }
function expiryPill(it) {
  const d = daysUntil(it.expiry_date);
  if (d === null) return "";
  if (d < 0) return `<span class="pill bad">expired</span>`;
  if (d <= 3) return `<span class="pill warn">exp ${d}d</span>`;
  return `<span class="pill info">exp ${d}d</span>`;
}
function statusPill(it) {
  if (it.status === "out") return `<span class="pill bad">out</span>`;
  if (it.status === "low") return `<span class="pill warn">low</span>`;
  return `<span class="pill good">in stock</span>`;
}

function renderMessages() {
  return `${error ? `<div class="error">${esc(error)}</div>` : ""}${notice ? `<div class="notice">${esc(notice)}</div>` : ""}`;
}

function visibleItems() { return visibleItemsOf(items, view); }

function renderItem(it) {
  return `
    <article class="card item ${it.status === "low" ? "low" : it.status === "out" ? "out" : ""}">
      <div style="min-width:0;">
        <div class="item-name">${esc(it.name)} ${statusPill(it)} ${expiryPill(it)}</div>
        <div class="item-meta">
          ${esc(CAT_LABEL[it.category] || it.category)}${it.unit ? ` · ${esc(it.unit)}` : ""}${it.owner_name ? ` · ${esc(it.owner_name)}` : ""}
        </div>
        <div class="row-actions" style="justify-content:flex-start;margin-top:8px;">
          ${it.status !== "ok" ? `<button class="btn btn-sm" data-grocery="${esc(it.id)}">→ Grocery</button>` : ""}
          <button class="btn btn-ghost btn-sm" data-edit="${esc(it.id)}">Edit</button>
          <button class="btn btn-danger btn-sm" data-remove="${esc(it.id)}">Remove</button>
        </div>
      </div>
      <div class="qty">
        <button class="qty-btn" data-dec="${esc(it.id)}" aria-label="Decrease">−</button>
        <span class="qty-val">${esc(String(it.quantity))}</span>
        <button class="qty-btn" data-inc="${esc(it.id)}" aria-label="Increase">+</button>
      </div>
    </article>
  `;
}

function render() {
  const root = document.getElementById("root");
  root.className = "app";
  const list = visibleItems();
  const lowCount = items.filter(i => i.status !== "ok").length;
  root.innerHTML = `
    <div class="topbar">
      <div>
        <h1>🥫 Pantry Inventory</h1>
        <p class="muted tiny">${lowCount ? `${lowCount} item${lowCount === 1 ? "" : "s"} running low` : "Everything's stocked"}</p>
      </div>
      <button class="btn" data-add>Add item</button>
    </div>
    ${renderMessages()}
    <div class="tabs">
      <button class="tab ${view === "all" ? "active" : ""}" data-tab="all">All</button>
      <button class="tab ${view === "low" ? "active" : ""}" data-tab="low">Low${lowCount ? ` (${lowCount})` : ""}</button>
      ${CATEGORIES.map(c => `<button class="tab ${view === c ? "active" : ""}" data-tab="${c}">${CAT_LABEL[c]}</button>`).join("")}
    </div>
    <section class="stack">
      ${list.length ? list.map(renderItem).join("") : `<div class="card empty">Nothing here yet.</div>`}
    </section>
  `;
}

// ── events ───────────────────────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.hasAttribute("data-close")) { closeModal(); return; }
  if (t.hasAttribute("data-add")) { openItemModal(null); return; }
  if (t.hasAttribute("data-edit")) { openItemModal(t.getAttribute("data-edit")); return; }
  if (t.hasAttribute("data-tab")) { view = t.getAttribute("data-tab"); render(); return; }
  if (t.hasAttribute("data-inc")) { adjustQty(t.getAttribute("data-inc"), 1); return; }
  if (t.hasAttribute("data-dec")) { adjustQty(t.getAttribute("data-dec"), -1); return; }
  if (t.hasAttribute("data-remove")) { removeItem(t.getAttribute("data-remove")); return; }
  if (t.hasAttribute("data-grocery")) { pushToGrocery(t.getAttribute("data-grocery")); return; }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "item-form") return;
  e.preventDefault();
  const f = e.target;
  const existingId = f.getAttribute("data-id") || null;
  const btn = f.querySelector(".modal-actions .btn:not(.btn-ghost)");
  const val = (id) => document.getElementById(id)?.value ?? "";
  if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
  saveItem({
    name: val("f-name"), category: val("f-category"), quantity: val("f-qty"),
    unit: val("f-unit"), low_threshold: val("f-low"), expiry_date: val("f-expiry"),
    owner_name: val("f-owner"), note: val("f-note"),
  }, existingId).catch(() => { if (btn) { btn.disabled = false; btn.textContent = existingId ? "Save" : "Add item"; } });
});

refresh();
</script>
</body>
</html>
